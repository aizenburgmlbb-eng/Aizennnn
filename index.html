<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Амина — Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #4A3B32;
            --text-muted: #8B7D73;
            --card-bg: rgba(255, 255, 255, 0.85);
            --accent: #D9734E;
            --accent-hover: #C2623E;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background-color: #FFF7ED;
            /* Ваш осенний фон */
            background-image: url('https://i.imgur.com/your_image.jpg'); /* ЗАМЕНИТЕ НА ССЫЛКУ НА ВАШ ФОН */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        /* Эффект стекла для карточек */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 16px;
            box-shadow: 0 4px 15px rgba(217, 115, 78, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        /* Задержки для анимации */
        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Шапка профиля */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F3A183, #D9734E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: 800;
            color: white;
            border: 3px solid #FFF;
            box-shadow: 0 2px 10px rgba(217, 115, 78, 0.3);
            flex-shrink: 0;
        }

        .user-info h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .user-info .level {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            background: rgba(217, 115, 78, 0.15);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 4px;
        }

        /* Финансы */
        .finance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .finance-item {
            text-align: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 14px;
        }

        .finance-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
            font-weight: 600;
        }

        .finance-value {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-main);
        }

        .finance-sub {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* Статистика (Топ, Реп) */
        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .stat-item {
            flex: 1;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 800;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Кнопка Daily */
        .btn-daily {
            width: 100%;
            padding: 16px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(217, 115, 78, 0.3);
            transition: transform 0.1s, background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-daily:active {
            transform: scale(0.96);
            background: var(--accent-hover);
        }

        .btn-daily:disabled {
            background: #D1C8C3;
            color: #FFF;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Прогресс-бар Daily */
        .daily-progress-container {
            text-align: center;
        }
        
        .progress-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(0,0,0,0.05);
            border-radius: 10px;
            overflow: hidden;
            margin: 8px 0;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.3s;
        }

        /* Питомец */
        .pet-card {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .pet-emoji { font-size: 32px; }
        .pet-details h4 { margin: 0; font-size: 15px; }
        .pet-details p { margin: 2px 0 0; font-size: 12px; color: var(--text-muted); }

        .loading { text-align: center; margin-top: 50px; font-weight: 600; color: var(--text-main); }
    </style>
</head>
<body>

    <div id="app" class="app-container">
        <div class="loading">Собираем листья... 🍂</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Ссылка на ваш сервер Bothost
        const API_URL = 'https://bot-1792298312-5363-ayzen.bothost.tech';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                renderProfile(data);

            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="card" style="color: var(--accent); text-align: center;">
                        Ошибка загрузки: ${error.message}
                    </div>
                `;
            }
        }

        function renderProfile(data) {
            const initial = data.name.charAt(0).toUpperCase();
            
            // Блок брака
            let marriageHtml = '';
            if (data.spouse) {
                marriageHtml = `<div class="status-badge">💍 В браке с ${data.spouse}</div>`;
            } else {
                marriageHtml = `<div class="status-badge" style="background: rgba(0,0,0,0.05); color: var(--text-muted);">💔 Свободен(на)</div>`;
            }

            // Блок питомца
            let petHtml = '';
            if (data.pet) {
                petHtml = `
                    <div class="card pet-card">
                        <div class="pet-emoji">${data.pet.emoji}</div>
                        <div class="pet-details">
                            <h4>${data.pet.name}</h4>
                            <p>Настроение: ${data.pet.mood}/100</p>
                        </div>
                    </div>
                `;
            }

            // Блок Daily
            let dailyHtml = '';
            if (data.daily_available) {
                dailyHtml = `<button class="btn-daily" onclick="claimDaily()" id="daily-btn">🎁 Забрать 500 msg</button>`;
            } else {
                // Прогресс бар для ожидания
                const totalHours = 24;
                const left = data.daily_hours_left;
                const percent = ((totalHours - left) / totalHours) * 100;
                dailyHtml = `
                    <div class="card daily-progress-container">
                        <div style="font-weight: 600; font-size: 14px;">🎁 Следующий бонус</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">через ${left} ч.</div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }

            const vipMark = data.vip ? ' 👑' : '';

            document.getElementById('app').innerHTML = `
                <!-- Шапка -->
                <div class="card profile-header">
                    <div class="avatar">${initial}</div>
                    <div class="user-info">
                        <h2>${data.name}${vipMark}</h2>
                        <div class="level">Уровень ${data.level}: ${data.level_title}</div>
                        ${marriageHtml}
                    </div>
                </div>

                <!-- Финансы -->
                <div class="card">
                    <div class="finance-grid">
                        <div class="finance-item">
                            <div class="finance-label">👛 Кошелек</div>
                            <div class="finance-value">${data.balance.toLocaleString()}</div>
                        </div>
                        <div class="finance-item">
                            <div class="finance-label">🏦 Банк</div>
                            <div class="finance-value">${data.bank_balance.toLocaleString()}</div>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="card stats-row">
                    <div class="stat-item">
                        <div class="stat-value">#${data.rank}</div>
                        <div class="stat-label">🏆 Место в топе</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.rep}</div>
                        <div class="stat-label">⭐ Репутация</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.streak}/7</div>
                        <div class="stat-label">🔥 Стрик</div>
                    </div>
                </div>

                <!-- Питомец -->
                ${petHtml}

                <!-- Daily (Кнопка или Прогресс) -->
                ${dailyHtml}
            `;
        }

        async function claimDaily() {
            const btn = document.getElementById('daily-btn');
            btn.disabled = true;
            btn.innerText = 'Получаем...';

            try {
                const response = await fetch(`${API_URL}/api/daily`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`Вы получили ${data.amount} msg!\nНовый баланс: ${data.new_balance}`);
                    loadProfile(); // Обновляем экран
                } else {
                    tg.showAlert(data.error || 'Ошибка');
                    btn.disabled = false;
                    btn.innerText = '🎁 Забрать 500 msg';
                }
            } catch (e) {
                tg.showAlert('Ошибка сети');
                btn.disabled = false;
                btn.innerText = '🎁 Забрать 500 msg';
            }
        }

        loadProfile();
    </script>
</body>
</html>
