<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Амина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #3A2A20;
            --text-muted: #7A6A60;
            --card-bg: rgba(255, 255, 255, 0.75); /* Сделали чуть плотнее */
            --accent: #D9734E;
            --accent-hover: #C2623E;
        }

        body {
            margin: 0;
            padding: 15px;
            padding-bottom: 80px; /* Место для нижнего меню */
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background-color: #FFF7ED;
            background-image: url('https://images.unsplash.com/photo-1507371341162-763b5e419408?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px); /* Уменьшили размытие с 16 до 12 */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 16px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(217, 115, 78, 0.1);
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* --- ШАПКА ПРОФИЛЯ --- */
        .profile-header {
            display: flex;
            align-items: center;
            justify-content: space-between; /* Раздвигаем аватарку и текст */
        }

        .avatar {
            width: 85px; /* Увеличили аватарку */
            height: 85px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F3A183, #D9734E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 800;
            color: white;
            border: 3px solid #FFF;
            box-shadow: 0 0 15px rgba(217, 115, 78, 0.4);
            flex-shrink: 0;
            overflow: hidden;
        }

        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        .user-info {
            text-align: right; /* Текст прижимаем вправо */
            flex-grow: 1;
            margin-left: 10px; /* Отступ от аватарки */
        }

        .user-info h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.2;
        }

        .level {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(217, 115, 78, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
        }

        /* Финансы */
        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .finance-item { text-align: center; padding: 12px; background: rgba(255,255,255,0.6); border-radius: 16px; }
        .finance-label { font-size: 13px; color: var(--text-muted); margin-bottom: 4px; font-weight: 800; }
        .finance-value { font-size: 20px; font-weight: 800; }

        /* Статистика */
        .stats-row { display: flex; justify-content: space-around; text-align: center; }
        .stat-item { flex: 1; border-right: 1px solid rgba(0,0,0,0.05); }
        .stat-item:last-child { border-right: none; }
        .stat-value { font-size: 20px; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 800; }

        /* Кнопки и прогресс */
        .btn {
            width: 100%; padding: 16px; background: var(--accent); color: white;
            border: none; border-radius: 16px; font-size: 16px; font-weight: 800;
            font-family: inherit; cursor: pointer; box-shadow: 0 4px 15px rgba(217, 115, 78, 0.3);
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { background: #C4B6B0; box-shadow: none; }
        
        .btn-secondary { background: #FFF; color: var(--accent); border: 2px solid var(--accent); box-shadow: none; }

        .progress-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.06); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; }

        /* Питомец */
        .pet-card { display: flex; align-items: center; gap: 12px; }
        .pet-emoji { font-size: 32px; }

        /* --- НИЖНЕЕ МЕНЮ --- */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            display: flex; justify-content: space-around;
            padding: 10px 0 20px; border-top: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 100;
        }
        .nav-btn {
            background: none; border: none; font-size: 12px; font-weight: 800;
            color: var(--text-muted); display: flex; flex-direction: column; align-items: center;
            gap: 4px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span.icon { font-size: 24px; }

        /* Ссылки */
        .link-item {
            display: flex; align-items: center; gap: 12px;
            padding: 12px; background: rgba(255,255,255,0.5); border-radius: 14px;
            margin-bottom: 8px; text-decoration: none; color: var(--text-main); font-weight: 800;
        }

        /* VIP Карточки */
        .vip-card {
            border: 2px solid rgba(217, 115, 78, 0.3); padding: 12px;
            border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
            background: rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПРОФИЛЬ -->
    <div id="screen-profile" class="app-container">
        <div class="loading" style="color:#FFF; text-shadow:0 1px 3px #000;">Загрузка... 🍂</div>
    </div>

    <!-- ЭКРАН 2: VIP -->
    <div id="screen-vip" class="app-container" style="display: none;">
        <div class="card" style="text-align: center;">
            <h2 style="margin-top:0;">👑 VIP Подписка</h2>
            <p style="font-size:14px; color:var(--text-muted);">Ускоренный доход, кулдауны короче, защита от варнов.</p>
        </div>
        <div id="vip-list"></div>
    </div>

    <!-- ЭКРАН 3: ССЫЛКИ -->
    <div id="screen-links" class="app-container" style="display: none;">
        <div class="card">
            <h2 style="margin-top:0;">🔗 Полезные ссылки</h2>
            <a href="https://t.me/Amina_updates" target="_blank" class="link-item">
                <span style="font-size:20px;">📢</span> Канал с новостями
            </a>
            <a href="https://t.me/chat_games_Gojo" target="_blank" class="link-item">
                <span style="font-size:20px;">💬</span> Наша группа
            </a>
            <a href="https://t.me/Kaoruko_off" target="_blank" class="link-item">
                <span style="font-size:20px;">👑</span> Владелец бота
            </a>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('profile', this)">
            <span class="icon">👤</span> Профиль
        </button>
        <button class="nav-btn" onclick="switchTab('vip', this)">
            <span class="icon">👑</span> VIP
        </button>
        <button class="nav-btn" onclick="switchTab('links', this)">
            <span class="icon">🔗</span> Ссылки
        </button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'https://bot-1792298312-5363-ayzen.bothost.tech';
        let userBalance = 0; // Храним баланс для VIP

        // Переключение вкладок
        function switchTab(tabId, btn) {
            document.querySelectorAll('.app-container').forEach(el => el.style.display = 'none');
            document.getElementById(`screen-${tabId}`).style.display = 'flex';
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            if(tabId === 'vip') renderVipScreen(); // Обновляем баланс на вкладке VIP
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                
                userBalance = data.balance; // Сохраняем баланс
                renderProfile(data);

            } catch (error) {
                document.getElementById('screen-profile').innerHTML = `
                    <div class="card" style="text-align: center; color: #D9734E;">
                        <b>Ошибка загрузки:</b><br>${error.message}
                    </div>
                `;
            }
        }

        function renderProfile(data) {
            const initial = data.name.charAt(0).toUpperCase();
            let avatarContent = `<span>${initial}</span>`;
            if (data.avatar_url) avatarContent = `<img src="${data.avatar_url}" alt="avatar">`;
            
            let marriageHtml = data.spouse 
                ? `<div class="status-badge">💍 В браке с ${data.spouse}</div>`
                : `<div class="status-badge" style="background: rgba(0,0,0,0.05); color: var(--text-muted);">💔 Свободен(на)</div>`;

            let petHtml = '';
            if (data.pet) {
                petHtml = `
                    <div class="card pet-card">
                        <div class="pet-emoji">${data.pet.emoji}</div>
                        <div>
                            <h4 style="margin:0 0 4px;">${data.pet.name}</h4>
                            <p style="margin:0; font-size:12px; color:var(--text-muted);">Настроение: ${data.pet.mood}/100</p>
                        </div>
                    </div>
                `;
            }

            let dailyHtml = '';
            if (data.daily_available) {
                dailyHtml = `<button class="btn" onclick="claimDaily()" id="daily-btn">🎁 Забрать 500 msg</button>`;
            } else {
                const percent = ((24 - data.daily_hours_left) / 24) * 100;
                dailyHtml = `
                    <div class="card" style="text-align: center;">
                        <div style="font-weight: 800;">🎁 Следующий бонус</div>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">через ${data.daily_hours_left} ч.</div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                    </div>
                `;
            }

            const vipMark = data.vip ? ' 👑' : '';

            document.getElementById('screen-profile').innerHTML = `
                <div class="card profile-header">
                    <div class="avatar">${avatarContent}</div>
                    <div class="user-info">
                        <h2>${data.name}${vipMark}</h2>
                        <div class="level">Уровень ${data.level}: ${data.level_title}</div>
                        ${marriageHtml}
                    </div>
                </div>

                <div class="card">
                    <div class="finance-grid">
                        <div class="finance-item">
                            <div class="finance-label">👛 Кошелек</div>
                            <div class="finance-value">${data.balance.toLocaleString()}</div>
                        </div>
                        <div class="finance-item">
                            <div class="finance-label">🏦 Банк</div>
                            <div class="finance-value">${data.bank_balance.toLocaleString()}</div>
                        </div>
                    </div>
                </div>

                <div class="card stats-row">
                    <div class="stat-item">
                        <div class="stat-value">#${data.rank}</div>
                        <div class="stat-label">🏆 Топ</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.rep}</div>
                        <div class="stat-label">⭐ Репутация</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.streak}/7</div>
                        <div class="stat-label">🔥 Стрик</div>
                    </div>
                </div>

                ${petHtml}
                ${dailyHtml}
            `;
        }

        // --- VIP ЛОГИКА ---
        function renderVipScreen() {
            document.getElementById('vip-list').innerHTML = `
                <div class="card" style="text-align: center; margin-bottom: 10px;">
                    <div style="font-size: 14px; color: var(--text-muted);">Ваш баланс:</div>
                    <div style="font-size: 24px; font-weight: 800; color: var(--accent);">${userBalance.toLocaleString()} msg</div>
                </div>
                <div class="card">
                    <div class="vip-card">
                        <div><b>1 неделя</b><br><small style="color:var(--text-muted)">2 000 msg</small></div>
                        <button class="btn" style="width: auto; padding: 8px 16px; font-size: 14px;" onclick="buyVip(1)">Купить</button>
                    </div>
                    <div class="vip-card">
                        <div><b>2 недели</b><br><small style="color:var(--text-muted)">4 000 msg</small></div>
                        <button class="btn" style="width: auto; padding: 8px 16px; font-size: 14px;" onclick="buyVip(2)">Купить</button>
                    </div>
                    <div class="vip-card">
                        <div><b>3 недели</b><br><small style="color:var(--text-muted)">6 000 msg</small></div>
                        <button class="btn" style="width: auto; padding: 8px 16px; font-size: 14px;" onclick="buyVip(3)">Купить</button>
                    </div>
                </div>
            `;
        }

        async function buyVip(weeks) {
            tg.HapticFeedback.impactOccurred('medium');
            try {
                const response = await fetch(`${API_URL}/api/buy_vip`, {
                    method: 'POST',
                    headers: { 
                        'X-Telegram-Init-Data': tg.initData,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ weeks: weeks })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`👑 VIP успешно куплен на ${weeks} нед.!\nНовый баланс: ${data.new_balance} msg`);
                    loadProfile(); // Обновляем данные профиля и баланс
                    switchTab('profile', document.querySelectorAll('.nav-btn')[0]); // Перекидываем на профиль
                } else {
                    tg.showAlert(data.error || 'Ошибка');
                }
            } catch (e) {
                tg.showAlert('Ошибка сети');
            }
        }

        // --- DAILY ---
        async function claimDaily() {
            const btn = document.getElementById('daily-btn');
            if(!btn) return;
            btn.disabled = true;
            btn.innerText = 'Получаем...';

            try {
                const response = await fetch(`${API_URL}/api/daily`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                const data = await response.json();
                
                if (data.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`Вы получили ${data.amount} msg!\nНовый баланс: ${data.new_balance}`);
                    loadProfile(); 
                } else {
                    tg.showAlert(data.error || 'Ошибка');
                    btn.disabled = false;
                    btn.innerText = '🎁 Забрать 500 msg';
                }
            } catch (e) {
                tg.showAlert('Ошибка сети');
                btn.disabled = false;
                btn.innerText = '🎁 Забрать 500 msg';
            }
        }

        // Инициализация
        loadProfile();
    </script>
</body>
</html>
