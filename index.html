<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Амина — Профиль</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #3A2A20; /* Темно-коричневый для контраста */
            --text-muted: #7A6A60;
            --card-bg: rgba(255, 255, 255, 0.65); /* Полупрозрачный белый */
            --accent: #D9734E; /* Терракотовый */
            --accent-hover: #C2623E;
        }

        body {
            margin: 0;
            padding: 15px;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background-color: #FFF7ED;
            
            /* !!! ЗАМЕНИТЕ ССЫЛКУ НИЖЕ НА ВАШУ КАРТИНКУ С ЛИСТЬЯМИ !!! */
            background-image: url('https://images.unsplash.com/photo-1507371341162-763b5e419408?q=80&w=1000&auto=format&fit=crop'); 
            
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 500px;
            margin: 0 auto;
            padding-bottom: 30px;
        }

        /* ЭФФЕКТ МАТОВОГО СТЕКЛА */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px rgba(217, 115, 78, 0.15);
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .card:nth-child(1) { animation-delay: 0.05s; }
        .card:nth-child(2) { animation-delay: 0.1s; }
        .card:nth-child(3) { animation-delay: 0.15s; }
        .card:nth-child(4) { animation-delay: 0.2s; }
        .card:nth-child(5) { animation-delay: 0.25s; }

        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Шапка профиля */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: linear-gradient(135deg, #F3A183, #D9734E);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: 800;
            color: white;
            border: 2px solid #FFF;
            box-shadow: 0 0 15px rgba(217, 115, 78, 0.4);
            flex-shrink: 0;
            overflow: hidden; /* Обрезаем фото по кругу */
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .user-info h2 {
            margin: 0 0 4px 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level {
            font-size: 13px;
            color: var(--text-muted);
            font-weight: 600;
            margin-bottom: 6px;
        }

        .status-badge {
            display: inline-block;
            background: rgba(217, 115, 78, 0.15);
            color: var(--accent);
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
        }

        /* Финансы */
        .finance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .finance-item {
            text-align: center;
            padding: 12px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .finance-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 800;
        }

        .finance-value {
            font-size: 20px;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Статистика (Топ, Реп) */
        .stats-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            text-align: center;
        }

        .stat-item {
            flex: 1;
            border-right: 1px solid rgba(0,0,0,0.05);
        }
        .stat-item:last-child { border-right: none; }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            color: var(--accent);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 800;
            margin-top: 4px;
        }

        /* Кнопка Daily */
        .btn-daily {
            width: 100%;
            padding: 18px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(217, 115, 78, 0.4);
            transition: transform 0.1s, background 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-daily:active {
            transform: scale(0.96);
            background: var(--accent-hover);
        }

        .btn-daily:disabled {
            background: #C4B6B0;
            box-shadow: none;
            cursor: not-allowed;
        }

        /* Прогресс-бар Daily */
        .daily-progress-container {
            text-align: center;
        }
        
        .progress-bar-bg {
            width: 100%;
            height: 14px;
            background: rgba(0,0,0,0.06);
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0 4px;
        }

        .progress-bar-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 10px;
            transition: width 0.5s ease-out;
        }

        /* Питомец */
        .pet-card {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .pet-emoji { font-size: 36px; }
        .pet-details h4 { margin: 0 0 4px; font-size: 16px; font-weight: 800; }
        .pet-details p { margin: 0; font-size: 13px; color: var(--text-muted); font-weight: 600; }

        .loading { text-align: center; margin-top: 50px; font-weight: 800; color: #FFF; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-size: 18px;}
    </style>
</head>
<body>

    <div id="app" class="app-container">
        <div class="loading">Собираем листья... 🍂</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Ссылка на ваш сервер Bothost
        const API_URL = 'https://bot-1792298312-5363-ayzen.bothost.tech';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, {
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                renderProfile(data);

            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="card" style="text-align: center; color: #D9734E;">
                        <b>Ошибка загрузки:</b><br>${error.message}
                    </div>
                `;
            }
        }

        function renderProfile(data) {
            const initial = data.name.charAt(0).toUpperCase();
            
            // Аватарка (фото или буква)
            let avatarContent = `<span>${initial}</span>`;
            if (data.avatar_url) {
                avatarContent = `<img src="${data.avatar_url}" alt="avatar">`;
            }
            
            // Блок брака
            let marriageHtml = '';
            if (data.spouse) {
                marriageHtml = `<div class="status-badge">💍 В браке с ${data.spouse}</div>`;
            } else {
                marriageHtml = `<div class="status-badge" style="background: rgba(0,0,0,0.05); color: var(--text-muted);">💔 Свободен(на)</div>`;
            }

            // Блок питомца
            let petHtml = '';
            if (data.pet) {
                petHtml = `
                    <div class="card pet-card">
                        <div class="pet-emoji">${data.pet.emoji}</div>
                        <div class="pet-details">
                            <h4>${data.pet.name}</h4>
                            <p>Настроение: ${data.pet.mood}/100</p>
                        </div>
                    </div>
                `;
            }

            // Блок Daily
            let dailyHtml = '';
            if (data.daily_available) {
                dailyHtml = `<button class="btn-daily" onclick="claimDaily()" id="daily-btn">🎁 Забрать 500 msg</button>`;
            } else {
                const totalHours = 24;
                const left = data.daily_hours_left;
                const percent = ((totalHours - left) / totalHours) * 100;
                dailyHtml = `
                    <div class="card daily-progress-container">
                        <div style="font-weight: 800; font-size: 15px;">🎁 Следующий бонус</div>
                        <div style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">через ${left} ч.</div>
                        <div class="progress-bar-bg">
                            <div class="progress-bar-fill" style="width: ${percent}%"></div>
                        </div>
                    </div>
                `;
            }

            const vipMark = data.vip ? ' 👑' : '';

            document.getElementById('app').innerHTML = `
                <!-- Шапка -->
                <div class="card profile-header">
                    <div class="avatar">${avatarContent}</div>
                    <div class="user-info">
                        <h2>${data.name}${vipMark}</h2>
                        <div class="level">Уровень ${data.level}: ${data.level_title}</div>
                        ${marriageHtml}
                    </div>
                </div>

                <!-- Финансы -->
                <div class="card">
                    <div class="finance-grid">
                        <div class="finance-item">
                            <div class="finance-label">👛 Кошелек</div>
                            <div class="finance-value">${data.balance.toLocaleString()}</div>
                        </div>
                        <div class="finance-item">
                            <div class="finance-label">🏦 Банк</div>
                            <div class="finance-value">${data.bank_balance.toLocaleString()}</div>
                        </div>
                    </div>
                </div>

                <!-- Статистика -->
                <div class="card stats-row">
                    <div class="stat-item">
                        <div class="stat-value">#${data.rank}</div>
                        <div class="stat-label">🏆 Топ</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.rep}</div>
                        <div class="stat-label">⭐ Репутация</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value">${data.streak}/7</div>
                        <div class="stat-label">🔥 Стрик</div>
                    </div>
                </div>

                <!-- Питомец -->
                ${petHtml}

                <!-- Daily (Кнопка или Прогресс) -->
                ${dailyHtml}
            `;
        }

        async function claimDaily() {
            const btn = document.getElementById('daily-btn');
            if(!btn) return;
            
            btn.disabled = true;
            btn.innerText = 'Получаем...';

            try {
                const response = await fetch(`${API_URL}/api/daily`, {
                    method: 'POST',
                    headers: { 'X-Telegram-Init-Data': tg.initData }
                });
                
                const data = await response.json();
                
                if (data.success) {
                    tg.HapticFeedback.notificationOccurred('success');
                    tg.showAlert(`Вы получили ${data.amount} msg!\\nНовый баланс: ${data.new_balance}`);
                    loadProfile(); // Обновляем экран
                } else {
                    tg.showAlert(data.error || 'Ошибка');
                    btn.disabled = false;
                    btn.innerText = '🎁 Забрать 500 msg';
                }
            } catch (e) {
                tg.showAlert('Ошибка сети');
                btn.disabled = false;
                btn.innerText = '🎁 Забрать 500 msg';
            }
        }

        loadProfile();
    </script>
</body>
</html>
