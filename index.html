<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Амина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Светлая тема */
            --text-main: #1C1C1E;
            --text-muted: #636366;
            --card-bg: rgba(255, 255, 255, 0.4); 
            --card-border: rgba(255, 255, 255, 0.6);
            --accent: #8A2BE2; 
            --accent-hover: #6A1CB2;
            --bg-image: url('/api/bg?theme=light');
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            --nav-bg: rgba(255, 255, 255, 0.5);
        }

        body[data-theme="dark"] {
            /* Тёмная тема */
            --text-main: #FFFFFF;
            --text-muted: #EBEBF5;
            --card-bg: rgba(30, 30, 40, 0.4); 
            --card-border: rgba(255, 255, 255, 0.15);
            --accent: #00FFFF; 
            --accent-hover: #00CCCC;
            --bg-image: url('/api/bg?theme=dark');
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --nav-bg: rgba(30, 30, 40, 0.6);
        }

        body {
            margin: 0; padding: 15px; padding-bottom: 90px;
            font-family: 'Nunito', sans-serif; color: var(--text-main);
            background-color: #1a1a2e;
            background-image: var(--bg-image);
            background-size: cover; background-position: center; background-attachment: fixed;
            min-height: 100vh; box-sizing: border-box;
            transition: color 0.3s ease;
            overflow-x: hidden; 
            touch-action: pan-y; /* Разрешаем скролл вверх-вниз, но обрабатываем свайпы влево-вправо */
        }

        /* Плавное появление контента */
        .app-container { 
            display: flex; flex-direction: column; gap: 15px; max-width: 500px; margin: 0 auto; 
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* iOS Стекло */
        .card {
            background: var(--card-bg); 
            backdrop-filter: blur(25px); 
            -webkit-backdrop-filter: blur(25px);
            border-radius: 24px; padding: 18px; 
            border: 1px solid var(--card-border);
            box-shadow: var(--shadow);
            transition: background 0.3s ease, border 0.3s ease;
        }

        .profile-header { display: flex; align-items: center; justify-content: space-between; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #F3A183, #D9734E);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; color: white;
            border: 3px solid var(--card-border); box-shadow: var(--shadow);
            flex-shrink: 0; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { text-align: right; flex-grow: 1; margin-left: 15px; }
        .user-info h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 800; line-height: 1.2; }
        .level { font-size: 14px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        
        .status-badge {
            display: inline-block; background: rgba(217, 115, 78, 0.15); color: var(--accent);
            padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 800;
            margin-top: 4px; margin-left: 4px; border: 1px solid var(--card-border);
        }

        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .finance-item { text-align: center; padding: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 16px; border: 1px solid var(--card-border); }
        .finance-label { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; font-weight: 800; }
        .finance-value { font-size: 22px; font-weight: 800; }

        .stats-row { display: flex; justify-content: space-around; text-align: center; }
        .stat-item { flex: 1; border-right: 1px solid var(--card-border); }
        .stat-item:last-child { border-right: none; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 800; }

        .btn {
            width: 100%; padding: 16px; background: var(--accent); color: white;
            border: none; border-radius: 16px; font-size: 16px; font-weight: 800;
            font-family: inherit; cursor: pointer; box-shadow: var(--shadow);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { background: #C4B6B0; box-shadow: none; cursor: not-allowed; opacity: 0.7; }

        .progress-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--nav-bg); 
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            display: flex; justify-content: space-around; padding: 10px 0 25px;
            border-top: 1px solid var(--card-border); 
            box-shadow: 0 -4px 15px rgba(0,0,0,0.1); z-index: 100;
            transition: background 0.3s ease;
        }
        .nav-btn {
            background: none; border: none; font-size: 11px; font-weight: 800;
            color: var(--text-muted); display: flex; flex-direction: column; align-items: center;
            gap: 4px; cursor: pointer; transition: color 0.3s;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span.icon { font-size: 22px; }

        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px; background: rgba(255, 255, 255, 0.1); border-radius: 16px;
            margin-bottom: 10px; border: 1px solid var(--card-border);
            text-decoration: none; color: inherit;
        }
        .item-info h4 { margin: 0 0 4px; font-size: 16px; }
        .item-info p { margin: 0; font-size: 13px; color: var(--text-muted); }

        .top-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid var(--card-border); }
        .top-item:last-child { border-bottom: none; }
        .top-avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 800; color: #fff; }
        .top-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .top-place { font-weight: 800; font-size: 18px; width: 30px; text-align: center; color: var(--accent); }

        .wheel-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 10px; position: relative; }
        .wheel {
            width: 200px; height: 200px; border-radius: 50%;
            background: conic-gradient(
                #FF6B6B 0deg 51.4deg, #4ECDC4 51.4deg 102.8deg, #45B7D1 102.8deg 154.2deg, 
                #FDCB6E 154.2deg 205.7deg, #A29BFE 205.7deg 257.1deg, #FD79A8 257.1deg 308.5deg, #B2BEC3 308.5deg 360deg
            );
            border: 8px solid var(--card-border); box-shadow: var(--shadow);
            position: relative; transition: transform 3s cubic-bezier(0.1, 0.8, 0.1, 1);
        }
        .wheel-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #FFF; border-radius: 50%; box-shadow: 0 0 10px rgba(0,0,0,0.3); z-index: 10; }
        .wheel-arrow { position: absolute; top: -15px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent; border-top: 20px solid var(--accent); z-index: 20; }

        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: var(--card-bg); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid var(--card-border); padding: 30px; border-radius: 24px; text-align: center; width: 80%; max-width: 320px; box-shadow: var(--shadow); }
        .case-grid { font-size: 32px; line-height: 1.5; margin: 15px 0; }
        .casino-slots { font-size: 40px; margin: 20px 0; display: flex; justify-content: space-around;}

        .rules-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .rules-tab { flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 15px; background: rgba(255,255,255,0.1); border-radius: 16px; cursor: pointer; border: 1px solid var(--card-border); transition: all 0.2s; }
        .rules-tab.active { background: var(--accent); color: white; box-shadow: var(--shadow); }
        .rules-item { background: rgba(255, 255, 255, 0.1); border-radius: 16px; margin-bottom: 10px; border: 1px solid var(--card-border); overflow: hidden; }
        .rules-header { padding: 15px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .rules-content { padding: 0 15px; max-height: 0; overflow: hidden; transition: max-height 0.3s ease-out, padding 0.3s ease; font-size: 14px; line-height: 1.5; color: var(--text-muted); }
        .rules-content.open { max-height: 800px; padding: 15px; border-top: 1px solid var(--card-border); }

        .theme-switch-container { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: rgba(255,255,255,0.1); border-radius: 16px; border: 1px solid var(--card-border); margin-top: 10px; }
        .theme-switch-container h4 { margin: 0; font-size: 16px; }
        .theme-btn { background: var(--card-bg); border: 1px solid var(--card-border); padding: 10px 20px; border-radius: 12px; font-weight: 800; font-size: 16px; color: var(--text-main); cursor: pointer; transition: transform 0.2s; }
        .theme-btn:active { transform: scale(0.95); }
    </style>
</head>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready(); tg.expand();
        const API_URL = 'https://bot-1793434826-8925-ayzen.bothost.tech';

        // ─── ЛОГИКА ТЕМЫ ───
        function applyTheme(theme) {
            const body = document.body;
            const btn = document.getElementById('theme-btn-settings');
            if (theme === 'light') {
                body.setAttribute('data-theme', 'light');
                btn.innerText = '☀️ Светлая';
                localStorage.setItem('theme', 'light');
            } else {
                body.setAttribute('data-theme', 'dark');
                btn.innerText = '🌙 Тёмная';
                localStorage.setItem('theme', 'dark');
            }
        }

        function toggleThemeSettings() {
            const current = document.body.getAttribute('data-theme');
            applyTheme(current === 'dark' ? 'light' : 'dark');
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            applyTheme(savedTheme);
        };

        // ─── ПЕРЕКЛЮЧЕНИЕ ВКЛАДОК ───
        let currentTabIndex = 0;
        const tabs = ['profile', 'games', 'top', 'shop', 'settings'];

        function switchTab(tabId, btnElement = null) {
            const newIndex = tabs.indexOf(tabId);
            if (newIndex === currentTabIndex) return;

            // Скрываем старый экран
            document.getElementById(`screen-${tabs[currentTabIndex]}`).style.display = 'none';
            
            // Показываем новый экран
            const nextScreen = document.getElementById(`screen-${tabId}`);
            nextScreen.style.display = 'flex';
            
            // Анимация появления
            nextScreen.classList.remove('fade-in');
            void nextScreen.offsetWidth; // trigger reflow
            nextScreen.classList.add('fade-in');

            // Обновляем кнопку в меню
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            if (btnElement) {
                btnElement.classList.add('active');
            } else {
                // Если свайпнули, находим нужную кнопку
                const targetBtn = document.querySelector(`.nav-btn[onclick*="switchTab('${tabId}'"]`);
                if (targetBtn) targetBtn.classList.add('active');
            }

            // Загружаем данные
            if(tabId === 'games' || tabId === 'shop') renderShop(); 
            if(tabId === 'top') loadTop();

            currentTabIndex = newIndex;
        }

        // ─── ОБРАБОТЧИК СВАЙПОВ ───
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50; // Минимальная длина свайпа в пикселях
            const diff = touchStartX - touchEndX;

            // Свайп влево (следующая вкладка)
            if (diff > swipeThreshold) {
                if (currentTabIndex < tabs.length - 1) {
                    switchTab(tabs[currentTabIndex + 1]);
                }
            }
            // Свайп вправо (предыдущая вкладка)
            if (diff < -swipeThreshold) {
                if (currentTabIndex > 0) {
                    switchTab(tabs[currentTabIndex - 1]);
                }
            }
        }

                { title: "5. Система наказаний", text: "⚠️ <b>Варн:</b> 3 варна = бан на 7 дней.<br>🚫 <b>Бан:</b> от 1 дня до навсегда.<br>🗑️ <b>Удаление аккаунта:</b> без права восстановления." }
            ],
            group: [
                { title: "1. Общение", text: "• Уважайте друг друга. Запрещены прямые оскорбления.<br>• Запрещен спам, флуд и капс." },
                { title: "2. Контент", text: "• Запрещены: порнография, шок-контент, экстремизм.<br>• Реклама разрешена только с согласия администрации." },

            ]
        };

        let currentRuleType = 'bot';

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                renderProfile(data);
            } catch (error) {
                document.getElementById('screen-profile').innerHTML = `<div class="card" style="text-align: center; color: #FF6B6B;">Ошибка: ${error.message}</div>`;
            }
        }

        function renderProfile(data) {
            const initial = data.name.charAt(0).toUpperCase();
            let avatarContent = data.avatar_url ? `<img src="${data.avatar_url}">` : `<span>${initial}</span>`;
            let vipLine = data.vip ? `<div class="status-badge" style="background:#FFD700; color:#000;">👑 VIP: ${data.vip_days} дн.</div>` : '';
            
            let idLine = `<div class="status-badge">ID: ${data.custom_id}</div>`;
            
            let regDate = '—';
            if (data.registered_at) {
                const d = new Date(data.registered_at);
                regDate = d.toLocaleDateString('ru-RU');
            }
            let regLine = `<div style="font-size:12px; color:var(--text-muted); margin-top:2px;">📅 Регистрация: ${regDate}</div>`;

            let marriageHtml = data.spouse ? `<div class="status-badge" style="margin-top:4px;">💍 В браке с ${data.spouse}</div>` : `<div class="status-badge" style="margin-top:4px;">💔 Свободен(на)</div>`;

            let wheelHtml = '';
            if (data.daily_available) {
                wheelHtml = `
                    <div class="card" style="text-align:center;">
                        <div class="wheel-container">
                            <div class="wheel-arrow"></div>
                            <div class="wheel" id="wheel"></div>
                            <div class="wheel-center"></div>
                        </div>
                        <button class="btn" onclick="spinWheel(this)" id="wheel-btn" style="margin-top: 20px;">Крутить колесо</button>
                    </div>
                `;
            } else {
                const percent = ((24 - data.daily_hours_left) / 24) * 100;
                wheelHtml = `
                    <div class="card" style="text-align: center;">
                        <div style="font-weight: 800;">🎁 Следующее колесо через ${data.daily_hours_left} ч.</div>
                        <div class="progress-bar-bg"><div class="progress-bar-fill" style="width: ${percent}%"></div></div>
                    </div>
                `;
            }

            let rulesBtn = `<button class="btn" id="btn-rules" style="margin-top: 10px; background: #8B7D73;" onclick="switchTab('rules', this)">📜 Правила бота и группы</button>`;

            document.getElementById('screen-profile').innerHTML = `
                <div class="card profile-header">
                    <div class="avatar">${avatarContent}</div>
                    <div class="user-info">
                        <h2>${data.name}</h2>
                        <div class="level">Уровень ${data.level}: ${data.level_title}</div>
                        <div>${idLine} ${vipLine}</div>
                        <div>${marriageHtml}</div>
                        ${regLine}
                    </div>
                </div>
                <div class="card"><div class="finance-grid">
                    <div class="finance-item"><div class="finance-label">👛 Кошелек</div><div class="finance-value">${data.balance.toLocaleString()}</div></div>
                    <div class="finance-item"><div class="finance-label">🏦 Банк</div><div class="finance-value">${data.bank_balance.toLocaleString()}</div></div>
                </div></div>
                <div class="card stats-row">
                    <div class="stat-item"><div class="stat-value">#${data.rank}</div><div class="stat-label">🏆 Топ</div></div>
                    <div class="stat-item"><div class="stat-value">${data.rep}</div><div class="stat-label">⭐ Реп</div></div>
                    <div class="stat-item"><div class="stat-value">${data.streak}/7</div><div class="stat-label">🔥 Стрик</div></div>
                </div>
                ${wheelHtml}
                ${rulesBtn}
            `;
        }

        async function spinWheel(btn) {
            btn.disabled = true; btn.innerText = 'Крутим...';
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(Math.random() * 360) + 3600;
            wheel.style.transform = `rotate(${randomDeg}deg)`;

            try {
                const res = await fetch(`${API_URL}/api/spin_wheel`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData } });
                const data = await res.json();
                
                setTimeout(() => {
                    if (data.success) {
                        tg.HapticFeedback.notificationOccurred('success');
                        tg.showAlert(`${data.prize.emoji} ${data.msg}`);
                        loadProfile();
                    } else {
                        tg.showAlert(data.error);
                        btn.disabled = false; btn.innerText = 'Крутить колесо';
                    }
                }, 3000);
            } catch(e) { tg.showAlert('Ошибка сети'); btn.disabled = false; btn.innerText = 'Крутить колесо'; }
        }

        async function loadTop() {
            const container = document.getElementById('top-list');
            container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Загрузка топа... 🏆</div>';
            try {
                const response = await fetch(`${API_URL}/api/top`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
                if(!response.ok) throw new Error();
                const data = await response.json();
                
                if (!Array.isArray(data) || data.length === 0) {
                    container.innerHTML = '<div style="text-align:center; padding:20px; color:var(--text-muted);">Топ пока пуст</div>';
                    return;
                }

                let html = '';
                data.forEach(item => {
                    let name = item.name || 'Игрок';
                    let av = item.avatar ? `<img src="${item.avatar}">` : name.charAt(0).toUpperCase();
                    let medal = item.place === 1 ? '🥇' : item.place === 2 ? '🥈' : item.place === 3 ? '🥉' : item.place;
                    let c_id = item.custom_id || 0;
                    let bal = item.balance || 0;
                    
                    html += `<div class="top-item">
                        <div class="top-place">${medal}</div>
                        <div class="top-avatar">${av}</div>
                        <div style="flex-grow:1; font-weight: 600;">${name} <span style="font-size:12px; color:var(--text-muted);">(ID: ${c_id})</span></div>
                        <div style="font-weight: 800; color: var(--accent);">${bal.toLocaleString()}</div>
                    </div>`;
                });
                container.innerHTML = html;
            } catch(e) { container.innerHTML = '<div style="color:#FF6B6B; text-align:center; padding:20px;">Ошибка загрузки топа. Проверьте API.</div>'; }
        }

        function renderShop() {
            document.getElementById('vip-list').innerHTML = `
                <div class="card">
                    <div class="item-card"><div class="item-info"><h4>1 неделя</h4><p>4 000 msg</p></div><button class="btn" style="width: auto; padding: 8px 16px;" onclick="buyVip(1)">Купить</button></div>
                    <div class="item-card"><div class="item-info"><h4>2 недели</h4><p>8 000 msg</p></div><button class="btn" style="width: auto; padding: 8px 16px;" onclick="buyVip(2)">Купить</button></div>
                    <div class="item-card"><div class="item-info"><h4>3 недели</h4><p>12 000 msg</p></div><button class="btn" style="width: auto; padding: 8px 16px;" onclick="buyVip(3)">Купить</button></div>
                </div>
            `;
            const cases = [
                {id: "case", name: "🎁 Обычный", price: 1000}, {id: "rarecase", name: "💎 Редкий", price: 5000},
                {id: "lcase", name: "👑 Легендарный", price: 25000}, {id: "petcase", name: "🐾 Питомец", price: 2500},
                {id: "petrarecase", name: "🐾 Редкий питомец", price: 5000}, {id: "weddingcase", name: "💍 Свадебный", price: 0},
            ];
            let casesHtml = '<div class="card">';
            cases.forEach(c => { casesHtml += `<div class="item-card"><div class="item-info"><h4>${c.name}</h4><p>${c.price > 0 ? c.price.toLocaleString() + ' msg' : 'Бесплатно'}</p></div><button class="btn" style="width: auto; padding: 8px 16px;" onclick="openCase('${c.id}')">Открыть</button></div>`; });
            casesHtml += '</div>';
            document.getElementById('cases-list').innerHTML = casesHtml;

            const starsPkgs = [{msg: "1 000", stars: 1}, {msg: "5 000", stars: 5}, {msg: "110 000", stars: 100}, {msg: "230 000", stars: 200}, {msg: "600 000", stars: 500}, {msg: "1 000 000", stars: 1000}];
            let starsHtml = '';
            starsPkgs.forEach(p => { starsHtml += `<div class="item-card" onclick="buyStars(${p.stars})"><div class="item-info"><h4>${p.msg} msg</h4></div><div style="font-weight: 800; color: #e6a817;">${p.stars} ⭐</div></div>`; });
            document.getElementById('stars-list').innerHTML = starsHtml;
        }

        function switchRules(type) {
            currentRuleType = type;
            document.getElementById('tab-bot').classList.remove('active'); document.getElementById('tab-group').classList.remove('active');
            if (type === 'bot') document.getElementById('tab-bot').classList.add('active'); else document.getElementById('tab-group').classList.add('active');
            renderRules();
        }

        function renderRules() {
            const list = document.getElementById('rules-list'); const rules = RULES_DATA[currentRuleType];
            let html = '';
            rules.forEach((rule, index) => {
                html += `<div class="rules-item"><div class="rules-header" onclick="toggleRule(${index})"><span>${rule.title}</span><span id="icon-${currentRuleType}-${index}">➕</span></div><div class="rules-content" id="content-${currentRuleType}-${index}">${rule.text}</div></div>`;
            });
            list.innerHTML = html;
        }

        function toggleRule(index) {
            const content = document.getElementById(`content-${currentRuleType}-${index}`); const icon = document.getElementById(`icon-${currentRuleType}-${index}`);
            if (content.classList.contains('open')) { content.classList.remove('open'); icon.innerText = '➕'; } 
            else {
                document.querySelectorAll(`.rules-content`).forEach(el => el.classList.remove('open')); document.querySelectorAll(`.rules-header span:last-child`).forEach(el => el.innerText = '➕');
                content.classList.add('open'); icon.innerText = '➖';
            }
        }

        function closeModal() { document.getElementById('modal').style.display = 'none'; }

        async function buyVip(weeks) {
            try {
                const res = await fetch(`${API_URL}/api/buy_vip`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify({ weeks: weeks }) });
                const data = await res.json();
                if (data.success) { tg.showAlert(`VIP куплен!`); loadProfile(); } else tg.showAlert(data.error);
            } catch(e) { tg.showAlert('Ошибка сети'); }
        }

        async function buyVipStars() {
            try {
                const res = await fetch(`${API_URL}/api/buy_vip_stars`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData } });
                const data = await res.json();
                if (data.success) {
                    tg.openInvoice(data.link, (status) => {
                        if (status === 'paid') { tg.HapticFeedback.notificationOccurred('success'); setTimeout(() => loadProfile(), 2000); }
                    });
                } else tg.showAlert(data.error);
            } catch(e) { tg.showAlert('Ошибка сети'); }
        }

        async function openCase(caseId) {
            const modal = document.getElementById('modal'); const title = document.getElementById('modal-title'); const body = document.getElementById('modal-body'); const desc = document.getElementById('modal-desc'); const btn = document.getElementById('modal-btn');
            modal.style.display = 'flex'; title.innerText = 'Крутим кейс...'; desc.innerText = ''; btn.style.display = 'none';
            const emojis = ['🎁', '🔥', '👋', '🎀', '👜', '👛', '🤑', '🤩', '🥳', '💎', '💰', '🏆', '⭐', '🎰', '👑'];
            let spin = setInterval(() => { let line = []; for(let i=0; i<9; i++) line.push(emojis[Math.floor(Math.random() * emojis.length)]); body.innerHTML = `<div>${line[0]} ${line[1]} ${line[2]}</div><div>${line[3]} ${line[4]} ${line[5]}</div><div>${line[6]} ${line[7]} ${line[8]}</div>`; }, 100);
            try {
                const res = await fetch(`${API_URL}/api/open_case`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify({ case_key: caseId }) });
                const data = await res.json();
                setTimeout(() => {
                    clearInterval(spin);
                    if (data.success) { tg.HapticFeedback.notificationOccurred('success'); title.innerText = '🎉 Результат!'; body.innerHTML = '✨'; desc.innerHTML = data.result_text.replace(/\n/g, '<br>'); loadProfile(); }
                    else { title.innerText = '❌ Ошибка'; body.innerHTML = '😢'; desc.innerText = data.error; }
                    btn.style.display = 'block';
                }, 2000);
            } catch(e) { clearInterval(spin); title.innerText = 'Ошибка'; btn.style.display = 'block'; }
        }

        async function playCasino(bet, btn) {
            btn.disabled = true;
            const modal = document.getElementById('modal'); const title = document.getElementById('modal-title'); const body = document.getElementById('modal-body'); const desc = document.getElementById('modal-desc'); const mbtn = document.getElementById('modal-btn');
            modal.style.display = 'flex'; title.innerText = '🎰 Крутим...'; desc.innerText = ''; mbtn.style.display = 'none'; body.classList.add('casino-slots');
            const slots = ["🍒", "🍋", "🍊", "⭐", "💎", "7️⃣"];
            let spin = setInterval(() => { body.innerHTML = `<span>${slots[Math.floor(Math.random()*6)]}</span> | <span>${slots[Math.floor(Math.random()*6)]}</span> | <span>${slots[Math.floor(Math.random()*6)]}</span>`; }, 100);
            try {
                const res = await fetch(`${API_URL}/api/casino`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify({ bet: bet }) });
                const data = await res.json();
                setTimeout(() => {
                    clearInterval(spin); body.classList.remove('casino-slots');
                    if (data.success) {
                        const [a,b,c] = data.result; body.innerHTML = `<div style="font-size:40px;">${a} | ${b} | ${c}</div>`;
                        if (data.win_amount > 0) { tg.HapticFeedback.notificationOccurred('success'); title.innerText = data.is_jackpot ? '🎉 ДЖЕКПОТ!' : '🎉 Победа!'; desc.innerHTML = `Выигрыш: <b style="color:green;">+${data.win_amount}</b> msg`; }
                        else { title.innerText = '😢 Проигрыш'; desc.innerHTML = `Потеряно: <b style="color:red;">-${bet}</b> msg`; }
                        loadProfile();
                    } else { title.innerText = '⏳ Ожидание'; body.innerHTML = '⏳'; desc.innerText = data.error; }
                    mbtn.style.display = 'block'; btn.disabled = false;
                }, 2000);
            } catch(e) { clearInterval(spin); title.innerText = 'Ошибка'; mbtn.style.display = 'block'; btn.disabled = false; }
        }

        async function buyStars(stars) {
            try {
                const res = await fetch(`${API_URL}/api/buy_stars`, { method: 'POST', headers: { 'X-Telegram-Init-Data': tg.initData, 'Content-Type': 'application/json' }, body: JSON.stringify({ stars: stars }) });
                const data = await res.json();
                if (data.success) {
                    tg.openInvoice(data.link, (status) => {
                        if (status === 'paid') { tg.HapticFeedback.notificationOccurred('success'); setTimeout(() => loadProfile(), 2000); }
                    });
                } else tg.showAlert(data.error);
            } catch(e) { tg.showAlert('Ошибка сети'); }
        }

        loadProfile();
    </script>
</body>
