<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Амина</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #3A2A20;
            --text-muted: #7A6A60;
            --card-bg: rgba(255, 255, 255, 0.85); /* Жидкое стекло */
            --accent: #D9734E;
            --accent-hover: #C2623E;
        }

        body {
            margin: 0;
            padding: 15px;
            padding-bottom: 90px;
            font-family: 'Nunito', sans-serif;
            color: var(--text-main);
            background-color: #FFF7ED;
            background-image: url('https://images.unsplash.com/photo-1507371341162-763b5e419408?q=80&w=1000&auto=format&fit=crop'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 8px 32px rgba(217, 115, 78, 0.15);
            animation: slideUp 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(15px);
        }

        @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }

        /* ШАПКА ПРОФИЛЯ */
        .profile-header { display: flex; align-items: center; justify-content: space-between; }
        .avatar {
            width: 100px; height: 100px; border-radius: 50%;
            background: linear-gradient(135deg, #F3A183, #D9734E);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px; font-weight: 800; color: white;
            border: 3px solid #FFF; box-shadow: 0 0 15px rgba(217, 115, 78, 0.4);
            flex-shrink: 0; overflow: hidden;
        }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { text-align: right; flex-grow: 1; margin-left: 15px; }
        .user-info h2 { margin: 0 0 4px 0; font-size: 24px; font-weight: 800; line-height: 1.2; }
        .level { font-size: 14px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
        
        .status-badge {
            display: inline-block; background: rgba(217, 115, 78, 0.15); color: var(--accent);
            padding: 4px 10px; border-radius: 12px; font-size: 13px; font-weight: 800;
            margin-top: 4px; margin-left: 4px;
        }

        /* Финансы */
        .finance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .finance-item { text-align: center; padding: 12px; background: rgba(255, 255, 255, 0.6); border-radius: 16px; }
        .finance-label { font-size: 14px; color: var(--text-muted); margin-bottom: 4px; font-weight: 800; }
        .finance-value { font-size: 22px; font-weight: 800; }

        /* Статистика */
        .stats-row { display: flex; justify-content: space-around; text-align: center; }
        .stat-item { flex: 1; border-right: 1px solid rgba(0,0,0,0.05); }
        .stat-item:last-child { border-right: none; }
        .stat-value { font-size: 22px; font-weight: 800; color: var(--accent); }
        .stat-label { font-size: 13px; color: var(--text-muted); font-weight: 800; }

        /* Кнопки */
        .btn {
            width: 100%; padding: 16px; background: var(--accent); color: white;
            border: none; border-radius: 16px; font-size: 16px; font-weight: 800;
            font-family: inherit; cursor: pointer; box-shadow: 0 4px 15px rgba(217, 115, 78, 0.3);
            transition: transform 0.1s, background 0.2s;
        }
        .btn:active:not(:disabled) { transform: scale(0.96); }
        .btn:disabled { background: #C4B6B0; box-shadow: none; cursor: not-allowed; opacity: 0.7; }

        .progress-bar-bg { width: 100%; height: 12px; background: rgba(0,0,0,0.06); border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 10px; }

        /* НИЖНЕЕ МЕНЮ */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            display: flex; justify-content: space-around;
            padding: 10px 0 25px; border-top: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.05); z-index: 100;
        }
        .nav-btn {
            background: none; border: none; font-size: 12px; font-weight: 800;
            color: var(--text-muted); display: flex; flex-direction: column; align-items: center;
            gap: 4px; cursor: pointer;
        }
        .nav-btn.active { color: var(--accent); }
        .nav-btn span.icon { font-size: 24px; }

        .item-card {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px; background: rgba(255, 255, 255, 0.6); border-radius: 16px;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.8);
            text-decoration: none; color: inherit;
        }
        .item-info h4 { margin: 0 0 4px; font-size: 16px; }
        .item-info p { margin: 0; font-size: 13px; color: var(--text-muted); }

        /* Топ */
        .top-item { display: flex; align-items: center; gap: 12px; padding: 10px; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .top-item:last-child { border-bottom: none; }
        .top-avatar { width: 40px; height: 40px; border-radius: 50%; background: #ccc; display: flex; align-items: center; justify-content: center; overflow: hidden; font-weight: 800; color: #fff; }
        .top-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .top-place { font-weight: 800; font-size: 18px; width: 30px; text-align: center; color: var(--accent); }

        /* Питомцы */
        .pet-card {
            display: flex; align-items: center; gap: 15px;
            padding: 15px; background: rgba(255, 255, 255, 0.6); border-radius: 16px;
            margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.8);
        }
        .pet-emoji { font-size: 40px; }
        .pet-info h4 { margin: 0 0 4px; font-size: 16px; }
        .pet-info p { margin: 0; font-size: 13px; color: var(--text-muted); }
        .pet-actions { display: flex; gap: 5px; margin-left: auto; }
        .pet-btn { padding: 8px 12px; font-size: 12px; border-radius: 10px; }

        /* Магический шар */
        .ball-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; }
        .magic-ball {
            width: 150px; height: 150px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #a8c0ff, #3f2b96);
            box-shadow: 0 0 30px rgba(63, 43, 150, 0.6), inset -10px -10px 20px rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: 50px; transition: all 0.3s ease;
        }
        .magic-ball.pulsing { animation: pulse 1.5s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 30px rgba(63, 43, 150, 0.6); }
            50% { transform: scale(1.05); box-shadow: 0 0 50px rgba(63, 43, 150, 0.9); }
            100% { transform: scale(1); box-shadow: 0 0 30px rgba(63, 43, 150, 0.6); }
        }
        .ball-answer { margin-top: 20px; font-size: 18px; font-weight: 800; text-align: center; color: #3f2b96; min-height: 50px; }

        /* Модалка */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-content {
            background: #FFF; padding: 30px; border-radius: 24px;
            text-align: center; width: 80%; max-width: 320px;
            box-shadow: 0 0 40px rgba(217, 115, 78, 0.3);
        }
        .case-grid { font-size: 32px; line-height: 1.5; margin: 15px 0; }
        .casino-slots { font-size: 40px; margin: 20px 0; display: flex; justify-content: space-around;}

        /* ПРАВИЛА */
        .rules-tabs {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        .rules-tab {
            flex: 1; padding: 12px; text-align: center; font-weight: 800; font-size: 15px;
            background: rgba(255,255,255,0.5); border-radius: 16px; cursor: pointer;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .rules-tab.active {
            background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(217, 115, 78, 0.3);
        }

        .rules-item {
            background: rgba(255, 255, 255, 0.7);
            border-radius: 16px;
            margin-bottom: 10px;
            border: 1px solid rgba(255,255,255,0.8);
            overflow: hidden;
        }
        .rules-header {
            padding: 15px; font-weight: 800; font-size: 16px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.4);
        }
        .rules-header:active { background: rgba(255, 255, 255, 0.8); }
        .rules-content {
            padding: 0 15px; max-height: 0; overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease;
            font-size: 14px; line-height: 1.5; color: var(--text-muted);
        }
        .rules-content.open {
            max-height: 800px; padding: 15px; border-top: 1px solid rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- ЭКРАН 1: ПРОФИЛЬ -->
    <div id="screen-profile" class="app-container">
        <div style="color:#FFF; text-shadow:0 1px 3px #000; text-align:center; margin-top:50px; font-weight: 800;">Загрузка... 🍂</div>
    </div>

    <!-- ЭКРАН 2: ПИТОМЦЫ -->
    <div id="screen-pets" class="app-container" style="display: none;">
        <div class="card" style="text-align: center;"><h2 style="margin-top:0;">🐾 Твои питомцы</h2></div>
        <div id="pets-list"></div>
    </div>

    <!-- ЭКРАН 3: РАЗВЛЕЧЕНИЯ -->
    <div id="screen-games" class="app-container" style="display: none;">
        <div class="card" style="text-align: center;"><h2 style="margin-top:0;">👑 VIP Подписка</h2></div>
        <div id="vip-list"></div>
        <div class="card" style="text-align: center; margin-top: 10px;"><h2 style="margin-top:0;">🎁 Кейсы</h2></div>
        <div id="cases-list"></div>
        <div class="card" style="text-align: center; margin-top: 10px;">
            <h2 style="margin-top:0;">🎰 Казино</h2>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center;">
                <button class="btn casino-btn" onclick="playCasino(1000, this)" style="width: 30%; padding: 10px; font-size: 14px;">1 000</button>
                <button class="btn casino-btn" onclick="playCasino(5000, this)" style="width: 30%; padding: 10px; font-size: 14px;">5 000</button>
                <button class="btn casino-btn" onclick="playCasino(10000, this)" style="width: 30%; padding: 10px; font-size: 14px;">10 000</button>
                <button class="btn casino-btn" onclick="playCasino(50000, this)" style="width: 45%; padding: 10px; font-size: 14px;">50 000</button>
                <button class="btn casino-btn" onclick="playCasino(100000, this)" style="width: 45%; padding: 10px; font-size: 14px;">100 000</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 4: МАГИЧЕСКИЙ ШАР -->
    <div id="screen-ball" class="app-container" style="display: none;">
        <div class="card">
            <h2 style="margin-top:0; text-align:center;">🔮 Магический шар</h2>
            <p style="text-align: center; color: var(--text-muted); font-size: 14px;">Загадай желание и нажми кнопку</p>
            <div class="ball-container">
                <div id="magic-ball" class="magic-ball">🔮</div>
                <div id="ball-answer" class="ball-answer"></div>
                <button class="btn" style="margin-top: 20px;" onclick="askBall(this)">Спросить шар</button>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 5: ТОП -->
    <div id="screen-top" class="app-container" style="display: none;">
        <div class="card" style="text-align: center;"><h2 style="margin-top:0;">🏆 Топ богачей</h2></div>
        <div id="top-list" class="card"></div>
    </div>

    <!-- ЭКРАН 6: МАГАЗИН -->
    <div id="screen-shop" class="app-container" style="display: none;">
        <div class="card"><h2 style="margin-top:0; text-align:center;">⭐ Покупка msg</h2><div id="stars-list"></div></div>
        <div class="card">
            <h2 style="margin-top:0;">🔗 Ссылки</h2>
            <a href="https://t.me/Amina_updates" target="_blank" class="item-card"><div class="item-info"><h4>📢 Канал</h4></div></a>
            <a href="https://t.me/chat_games_Gojo" target="_blank" class="item-card"><div class="item-info"><h4>💬 Группа</h4></div></a>
        </div>
    </div>

    <!-- ЭКРАН 7: ПРАВИЛА -->
    <div id="screen-rules" class="app-container" style="display: none;">
        <div class="card" style="text-align: center; padding-bottom: 10px;">
            <h2 style="margin-top:0;">📜 Правила</h2>
            <p style="color:var(--text-muted); font-size:14px; margin-bottom: 0;">Незнание правил не освобождает от ответственности</p>
            
            <!-- Переключатель Бот / Группа -->
            <div class="rules-tabs" style="margin-top: 15px;">
                <div class="rules-tab active" id="tab-bot" onclick="switchRules('bot')">🤖 Бот</div>
                <div class="rules-tab" id="tab-group" onclick="switchRules('group')">💬 Группа</div>
            </div>
        </div>
        
        <div class="card" id="rules-list">
            <!-- Сюда будут вставляться правила -->
        </div>
    </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title" style="margin-top:0;">Крутим...</h3>
            <div id="modal-body" class="case-grid"></div>
            <p id="modal-desc" style="font-weight: 600;"></p>
            <button id="modal-btn" class="btn" style="display:none; margin-top: 10px;" onclick="closeModal()">ОК</button>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <div class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('profile', this)"><span class="icon">👤</span> Профиль</button>
        <button class="nav-btn" onclick="switchTab('pets', this)"><span class="icon">🐾</span> Питомцы</button>
        <button class="nav-btn" onclick="switchTab('games', this)"><span class="icon">🎮</span> Игры</button>
        <button class="nav-btn" onclick="switchTab('ball', this)"><span class="icon">🔮</span> Шар</button>
        <button class="nav-btn" onclick="switchTab('top', this)"><span class="icon">🏆</span> Топ</button>
        <button class="nav-btn" onclick="switchTab('shop', this)"><span class="icon">🛒</span> Магазин</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const API_URL = 'https://bot-1792298312-5363-ayzen.bothost.tech';

        // --- ДАННЫЕ ПРАВИЛ ---
        const RULES_DATA = {
            bot: [
                { title: "1. Общие положения", text: "• Администрация имеет право изменять правила и наказывать нарушителей.<br>• Создание твинков (мультиаккаунтов) для накрутки бонусов или обхода банов строго запрещено.<br>• Незнание правил не освобождает от ответственности." },
                { title: "2. Экономика и msg", text: "• Запрещено использовать баги и эксплойты для накрутки валюты.<br>• Все подарки, переводы и ставки в играх добровольны. Возврат средств по причине 'случайно нажал' не производится.<br>• Ограбления — это игровая механика, жалобы на них не принимаются." },
                { title: "3. Браки и Анонимки", text: "• Предложение брака должно быть обоюдным. Обман ради завладения общим бюджетом карается баном.<br>• В анонимках запрещены: оскорбления, угрозы, 18+ контент и реклама." },
                { title: "4. Дуэли и Игры", text: "• Договорные матчи (слив ставок) запрещены.<br>• Запрещено использование стороннего ПО (скриптов, кликеров) для обхода кулдаунов." },
                { title: "5. Система наказаний", text: "⚠️ <b>Варн:</b> 3 варна = бан на 7 дней.<br>🚫 <b>Бан:</b> от 1 дня до навсегда (за мошенничество, обход правил).<br>🗑️ <b>Удаление аккаунта:</b> применяется к читерам и злостным нарушителям без права восстановления." }
            ],
            group: [
                { title: "1. Общение", text: "• Уважайте друг друга. Запрещены прямые оскорбления, унижения и травля.<br>• Запрещен спам, флуд и капс (сообщения из одних заглавных букв)." },
                { title: "2. Контент", text: "• Запрещены: порнография, шок-контент, призывы к насилию, экстремизм.<br>• Реклама сторонних ресурсов, ботов и каналов разрешена только с согласия администрации." },
                { title: "3. Конфликты", text: "• Решайте личные конфликты в личных сообщениях. Публичные разборки будут пресекаться модераторами.<br>• Не обсуждайте действия администрации в общем чате. Для этого есть ЛС владельца." },
                { title: "4. Наказания в группе", text: "• <b>Мут:</b> за флуд, спам или чрезмерный мат (от 1 часа до 24 часов).<br>• <b>Бан:</b> за агрессию, рекламу или нарушение правил 2+ раза." }
            ]
        };

        let currentRuleType = 'bot';

        function switchRules(type) {
            currentRuleType = type;
            document.getElementById('tab-bot').classList.remove('active');
            document.getElementById('tab-group').classList.remove('active');
            
            if (type === 'bot') document.getElementById('tab-bot').classList.add('active');
            else document.getElementById('tab-group').classList.add('active');

            renderRules();
        }

        function renderRules() {
            const list = document.getElementById('rules-list');
            const rules = RULES_DATA[currentRuleType];
            let html = '';
            
            rules.forEach((rule, index) => {
                html += `
                    <div class="rules-item">
                        <div class="rules-header" onclick="toggleRule(${index})">
                            <span>${rule.title}</span>
                            <span id="icon-${currentRuleType}-${index}">➕</span>
                        </div>
                        <div class="rules-content" id="content-${currentRuleType}-${index}">
                            ${rule.text}
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
        }

        function toggleRule(index) {
            const contentId = `content-${currentRuleType}-${index}`;
            const iconId = `icon-${currentRuleType}-${index}`;
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            if (content.classList.contains('open')) {
                content.classList.remove('open');
                icon.innerText = '➕';
            } else {
                // Закрываем все остальные
                document.querySelectorAll(`.rules-content`).forEach(el => el.classList.remove('open'));
                document.querySelectorAll(`.rules-header span:last-child`).forEach(el => el.innerText = '➕');
                
                content.classList.add('open');
                icon.innerText = '➖';
            }
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.app-container').forEach(el => el.style.display = 'none');
            document.getElementById(`screen-${tabId}`).style.display = 'flex';
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            
            if(tabId === 'games' || tabId === 'shop') renderShop(); 
            if(tabId === 'top') loadTop();
            if(tabId === 'pets') loadPets();
            if(tabId === 'rules') renderRules();
        }

        async function loadProfile() {
            try {
                const response = await fetch(`${API_URL}/api/profile`, { headers: { 'X-Telegram-Init-Data': tg.initData } });
                if (!response.ok) throw new Error('Ошибка сервера');
                const data = await response.json();
                renderProfile(data);
            } catch (error) {
                document.getElementById('screen-profile').innerHTML = `<div class="card" style="text-align: center; color: #D9734E;">Ошибка: ${error.message}</div>`;
            }
        }

        function renderProfile(data) {
            const initial = data.name.charAt(0).toUpperCase();
            let avatarContent = data.avatar_url ? `<img src="${data.avatar_url}">` : `<span>${initial}</span>`;
            let vipLine = data.vip ? `<div class="status-badge" style="background:#FFD700; color:#000;">👑 VIP: ${data.vip_days} дн.</div>` : '';
            let idLine = `<div class="status-badge" style="background:rgba(0,0,0,0.05); color:var(--text-muted);">ID: ${data.user_id}</div>`;
            let marriageHtml = data.spouse ? `<div class="status-badge" style="margin-top:4px;">💍 В браке с ${data.spouse}</div>` : `<div class="status-badge" style="margin-top:4px; background: rgba(0,0,0,0.05); color: var(--text-muted);">💔 Свободен(на)</div>`;

            let dailyHtml = '';
            if (data.daily_available) {
                dailyHtml = `<button class="btn" onclick="claimDaily()" id="daily-btn">🎁 Забрать 500 msg</button>`;
            } else {
                const percent = ((24 - data.daily_hours_left) / 24) * 100;
